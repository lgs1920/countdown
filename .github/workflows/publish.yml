name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Build demo
        run: bun run build
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(bun -p "require('./package.json').version")
          tag_version="${RELEASE_TAG#v}"
          test "$package_version" = "$tag_version"
      - name: Check whether the package version is already published
        id: npm-version
        env:
          PACKAGE_NAME: '@lgs1920/countdown'
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          package_version="${PACKAGE_VERSION#v}"
          if npm view "$PACKAGE_NAME@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$package_version is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package to npm
        if: steps.npm-version.outputs.published != 'true'
        env:
          COUNTDOWN_BUN_PUBLISH_LIFECYCLE: '1'
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
